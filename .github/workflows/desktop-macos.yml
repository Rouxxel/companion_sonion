name: Desktop macOS

# Manual only. Two modes:
# - dev build (default): ad-hoc signed arm64 app from standalone_desktop_version/macos, launched on the
#   runner from /Applications; uploads screenshots + the zipped app.
# - signed build (input "signed"): Developer ID–signed and notarized .dmg + .zip for arm64 and x64,
#   verified with codesign/spctl/stapler. Needs these repository secrets:
#     MACOS_CERTIFICATE_P12_BASE64   Developer ID Application certificate (.p12), base64-encoded
#     MACOS_CERTIFICATE_PASSWORD     password of that .p12
#     APPLE_API_KEY_P8               App Store Connect API key file content (AuthKey_XXXX.p8)
#     APPLE_API_KEY_ID               its key id
#     APPLE_API_ISSUER               issuer id
on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Signed + notarized release build (needs the Apple secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dev:
    if: ${{ !inputs.signed }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: standalone_desktop_version
    env:
      # No Developer ID certificate in dev builds: don't look for one in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone_desktop_version/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests (shared core + platforms)
        run: npm test

      - name: Build the app (arm64, unpacked, ad-hoc signed)
        working-directory: standalone_desktop_version/macos
        run: |
          npm run build
          npx electron-builder --mac dir --arm64 "-c.mac.identity=-" -c.mac.notarize=false
          sh scripts/verify-signature.sh "release/mac-arm64/Sonion Companion.app"

      - name: Launch from /Applications and take screenshots
        working-directory: standalone_desktop_version/macos
        run: |
          # Run from /Applications like a user would (outside it, the app offers to move itself there).
          rm -rf "/Applications/Sonion Companion.app"
          ditto "release/mac-arm64/Sonion Companion.app" "/Applications/Sonion Companion.app"
          APP="/Applications/Sonion Companion.app"
          DATA="$HOME/Library/Application Support/Sonion Companion"
          mkdir -p screenshots
          "$APP/Contents/MacOS/Sonion Companion" > screenshots/app.log 2>&1 &
          sleep 20
          screencapture -x screenshots/1-first-launch.png
          # Opening the app again must not start a second copy; it shows Settings instead.
          open -n "$APP"
          sleep 10
          screencapture -x screenshots/2-opened-again.png
          MAIN_PROCESSES=$(pgrep -f "Sonion Companion.app/Contents/MacOS/Sonion Companion$" | wc -l | tr -d ' ')
          {
            echo "Main processes after opening again: $MAIN_PROCESSES"
            echo "Open at Login after first launch (startWithWindows / autostartInitialized):"
            node -e "const s=require(process.argv[1]).settings; console.log(s.startWithWindows, s.autostartInitialized)" "$DATA/companions.json"
            ls -la "$DATA"
          } | tee screenshots/result.txt
          pkill -f "Sonion Companion.app/Contents/MacOS" || true
          # Leave the runner clean: remove the login item registration together with the app.
          rm -rf "/Applications/Sonion Companion.app"
          test "$MAIN_PROCESSES" = "1"

      - name: Zip the app for download
        if: always()
        working-directory: standalone_desktop_version/macos
        run: |
          if [ -d "release/mac-arm64/Sonion Companion.app" ]; then
            ditto -c -k --keepParent "release/mac-arm64/Sonion Companion.app" "SonionCompanion-dev-arm64.zip"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-dev-build
          path: |
            standalone_desktop_version/macos/screenshots/
            standalone_desktop_version/macos/SonionCompanion-dev-arm64.zip
          if-no-files-found: warn
          retention-days: 14

  signed:
    if: ${{ inputs.signed }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: standalone_desktop_version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone_desktop_version/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests (shared core + platforms)
        run: npm test

      - name: Write the App Store Connect API key to a temporary file
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "Secret APPLE_API_KEY_P8 is missing"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize (arm64 + x64)
        working-directory: standalone_desktop_version/macos
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npm run package:signed

      - name: Verify signature, Gatekeeper and notarization
        working-directory: standalone_desktop_version/macos
        run: |
          for APP in "release/mac-arm64/Sonion Companion.app" "release/mac/Sonion Companion.app"; do
            sh scripts/verify-signature.sh "$APP" --release
          done
          ls -la release

      - name: Remove the API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-build
          path: |
            standalone_desktop_version/macos/release/*.dmg
            standalone_desktop_version/macos/release/*.zip
            standalone_desktop_version/macos/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
