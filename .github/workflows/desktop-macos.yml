name: Desktop macOS

# Manual only. Modes:
# - dev build (default): ad-hoc signed universal .dmg from standalone_desktop_version/macos; the smoke
#   script installs it on the runner, launches it and uninstalls it; uploads screenshots + the .dmg.
# - signed build (input "signed"): Developer ID–signed and notarized universal .dmg + .zip (Apple
#   silicon + Intel in one app), verified with codesign/spctl/stapler/lipo and the smoke script in
#   release mode. Needs repository secrets:
#     MACOS_CERTIFICATE_P12_BASE64   Developer ID Application certificate (.p12), base64-encoded
#     MACOS_CERTIFICATE_PASSWORD     password of that .p12
#     APPLE_API_KEY_P8               App Store Connect API key file content (AuthKey_XXXX.p8)
#     APPLE_API_KEY_ID               its key id
#     APPLE_API_ISSUER               issuer id
# - publish (inputs "signed" + "publish"): uploads the signed files and latest-mac.yml to the GitHub
#   release "desktop-latest" (the update feed) after approval in the "desktop-release" environment.
on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Signed + notarized release build (needs the Apple secrets)"
        type: boolean
        default: false
      publish:
        description: "Publish the signed build to the desktop-latest release (needs approval)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dev:
    if: ${{ !inputs.signed }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: standalone_desktop_version
    env:
      # No Developer ID certificate in dev builds: don't look for one in the keychain.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone_desktop_version/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests (shared core + platforms)
        run: npm test

      - name: Build the app (universal .dmg, ad-hoc signed)
        working-directory: standalone_desktop_version/macos
        run: |
          npm run build
          npx electron-builder --mac dmg --universal "-c.mac.identity=-" -c.mac.notarize=false
          ls -la release

      - name: Smoke test (install from the .dmg, launch, open again, uninstall)
        working-directory: standalone_desktop_version/macos
        run: SCREENSHOT_DIR="$PWD/screenshots" bash scripts/smoke-macos.sh release/SonionCompanion-*-universal.dmg | tee smoke.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-dev-build
          path: |
            standalone_desktop_version/macos/screenshots/
            standalone_desktop_version/macos/smoke.txt
            standalone_desktop_version/macos/release/*.dmg
          if-no-files-found: warn
          retention-days: 14

  signed:
    if: ${{ inputs.signed }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: standalone_desktop_version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: standalone_desktop_version/package-lock.json

      - name: Install
        run: npm ci

      - name: Unit tests (shared core + platforms)
        run: npm test

      - name: Write the App Store Connect API key to a temporary file
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "Secret APPLE_API_KEY_P8 is missing"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Build, sign and notarize (universal)
        working-directory: standalone_desktop_version/macos
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npm run package:signed

      - name: Remove the API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Verify architectures, signature, Gatekeeper and notarization
        working-directory: standalone_desktop_version/macos
        run: |
          sh scripts/verify-signature.sh "release/mac-universal/Sonion Companion.app" --release
          test -f release/latest-mac.yml
          cat release/latest-mac.yml
          ls -la release

      - name: Smoke test the .dmg (release mode)
        working-directory: standalone_desktop_version/macos
        run: SCREENSHOT_DIR="$PWD/screenshots" bash scripts/smoke-macos.sh release/SonionCompanion-*-universal.dmg --release | tee smoke.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-build
          path: |
            standalone_desktop_version/macos/release/*.dmg
            standalone_desktop_version/macos/release/*.zip
            standalone_desktop_version/macos/release/*.blockmap
            standalone_desktop_version/macos/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-signed-smoke
          path: |
            standalone_desktop_version/macos/screenshots/
            standalone_desktop_version/macos/smoke.txt
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: signed
    if: ${{ inputs.signed && inputs.publish }}
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments) so publishing needs approval.
    environment: desktop-release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: desktop-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos-signed-build
          path: upload

      - name: Create the desktop-latest release if needed (pre-release, so it never becomes "Latest")
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "Sonion Companion (desktop) — latest" --notes "Latest desktop builds. See each platform's CHANGELOG.md."

      - name: Upload the macOS files (replaces latest-mac.yml)
        run: |
          ls -la upload
          gh release upload "$TAG" upload/* --clobber

      - name: Remove older macOS files (Windows/Linux files are untouched)
        run: |
          gh release view "$TAG" --json assets -q '.assets[].name' \
            | grep -E '^SonionCompanion-.*(-mac\.zip|\.dmg)(\.blockmap)?$' \
            | while read -r NAME; do
                if [ ! -f "upload/$NAME" ]; then echo "Deleting old asset $NAME"; gh release delete-asset "$TAG" "$NAME" --yes; fi
              done
